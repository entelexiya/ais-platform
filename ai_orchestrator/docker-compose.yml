version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_db:/app/orchestrator.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ./bot
    env_file:
      - .env
    volumes:
      - ./bot:/app
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000

  whatsapp:
    build:
      context: ./whatsapp_bot
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./whatsapp_bot:/app
      - /app/node_modules
      - wa_auth:/app/.wwebjs_auth
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  backend_db:
  wa_auth:
